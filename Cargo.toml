[workspace]
resolver = "3"
members = ["firmware", "drivers/rp2350-drivers"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"

embassy-usb-driver = "0.2.2"

embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "rp235xa",
    "critical-section-impl",
    "unstable-pac",
    "time-driver",
    "binary-info",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-usb = { version = "0.6", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"

static_cell = "2"
defmt = "1"
defmt-rtt = "1"

rp2350-drivers = { path = "drivers/rp2350-drivers" }

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
debug = false
codegen-units = 1
incremental = false
